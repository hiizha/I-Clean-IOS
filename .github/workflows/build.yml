
name: Build iClean IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build iClean
        run: |
          xcodebuild \
            -project iClean.xcodeproj \
            -scheme iClean \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/iClean.app Payload/
          zip -r iClean.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: iClean-unsigned-IPA
          path: iClean.ipa
          if-no-files-found: error
