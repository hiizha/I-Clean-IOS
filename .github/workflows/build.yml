
name: Build iClean IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Find Project Configuration
        run: |
          SPEC_FILE=$(find . -type f -name project.yml \
            -not -path './.git/*' -print -quit)

          if [ -z "$SPEC_FILE" ]; then
            echo "ERROR: project.yml tidak ditemukan!"
            find . -maxdepth 4 -type f
            exit 1
          fi

          SPEC_DIR=$(dirname "$SPEC_FILE")
          echo "SPEC_DIR=$SPEC_DIR" >> $GITHUB_ENV

          echo "Project ditemukan: $SPEC_FILE"

      - name: Generate Xcode Project
        run: |
          cd "$SPEC_DIR"
          xcodegen generate

      - name: Build iClean
        run: |
          xcodebuild \
            -project "$SPEC_DIR/iClean.xcodeproj" \
            -scheme iClean \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload

          cp -R \
            "$GITHUB_WORKSPACE/build/Build/Products/Release-iphoneos/iClean.app" \
            Payload/

          zip -r iClean.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: iClean-unsigned-IPA
          path: iClean.ipa
          if-no-files-found: error
