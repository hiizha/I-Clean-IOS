name: iClean
options:
  bundleIdPrefix: com.tesa
  deploymentTarget:
    iOS: "16.0"
targets:
  iClean:
    type: application
    platform: iOS
    sources:
      - iClean
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tesa.iclean
        PRODUCT_NAME: iClean
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: iClean
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
